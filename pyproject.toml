[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "distributed-job-engine"
version = "1.3.0"
description = "Async job engine with a FastAPI REST API, a SQLite/PostgreSQL priority queue and asyncio workers."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "yusufnote105g-maker" }]
keywords = ["job-queue", "task-queue", "fastapi", "sqlite", "postgresql", "asyncio", "background-jobs"]
classifiers = [
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "fastapi>=0.104,<0.105",
    "uvicorn>=0.24,<0.25",
    "pydantic>=1.10,<2.0",
    "SQLAlchemy>=1.4,<2.0",
    "prometheus-client>=0.20,<1.0",
]

[project.optional-dependencies]
# SQLAlchemy 1.4 has no psycopg 3 dialect, so psycopg2 is the supported driver.
# Alembic owns the PostgreSQL schema; SQLite keeps the zero-config `create_all`.
postgres = [
    "psycopg2-binary>=2.9,<3.0",
    "alembic>=1.13,<2.0",
]
otel = ["opentelemetry-sdk>=1.25"]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "httpx>=0.27,<1.0",
]

[project.scripts]
job-engine = "distributed_job_engine.cli:main"

[project.urls]
Repository = "https://github.com/yusufnote105g-maker/distributed-job-engine"
Changelog = "https://github.com/yusufnote105g-maker/distributed-job-engine/blob/master/CHANGELOG.md"

[tool.setuptools]
# The repository keeps the source in `src/`, but the installed distribution is
# named `distributed_job_engine` so that `import distributed_job_engine` and the
# `job-engine` console script work. All imports inside `src/` are relative, so
# the same files work both in-place and when installed.
package-dir = { "distributed_job_engine" = "src" }
packages = [
    "distributed_job_engine",
    "distributed_job_engine.api",
    "distributed_job_engine.migrations",
    "distributed_job_engine.migrations.versions",
    "distributed_job_engine.models",
    "distributed_job_engine.services",
]

[tool.setuptools.package-data]
# The migration scripts must ship inside the wheel so that
# `job-engine migrate` works on an installed package.
"distributed_job_engine.migrations" = ["script.py.mako", "versions/*.py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
