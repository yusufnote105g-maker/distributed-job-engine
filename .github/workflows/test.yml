name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

  benchmark:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run benchmark
        run: python benchmark/benchmark.py --jobs 300 --workers 4 --sleep 0.005

      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark/benchmark_results.json

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linters
        run: pip install flake8

      - name: Check for syntax errors and undefined names
        run: flake8 src tests benchmark --count --select=E9,F63,F7,F82 --show-source --statistics

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t distributed-job-engine:ci .

      - name: Run container
        run: docker run -d --name job-engine -p 8000:8000 distributed-job-engine:ci

      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/v1/health; then exit 0; fi
            sleep 1
          done
          echo "service did not become healthy"
          docker logs job-engine
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f job-engine || true
