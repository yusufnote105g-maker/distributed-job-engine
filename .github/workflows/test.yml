name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

  benchmark:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run benchmark
        run: python benchmark/benchmark.py --jobs 300 --workers 4 --sleep 0.005

      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark/benchmark_results.json

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linters
        run: pip install flake8

      - name: Check for syntax errors and undefined names
        run: flake8 src tests benchmark --count --select=E9,F63,F7,F82 --show-source --statistics

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t distributed-job-engine:ci .

      - name: Run container
        run: docker run -d --name job-engine -p 8000:8000 distributed-job-engine:ci

      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/v1/health; then exit 0; fi
            sleep 1
          done
          echo "service did not become healthy"
          docker logs job-engine
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f job-engine || true

  package:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write # attach artifacts to a release when a v* tag is pushed

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install the wheel into a clean virtualenv
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install --upgrade pip
          /tmp/wheel-venv/bin/pip install dist/*.whl
          /tmp/wheel-venv/bin/job-engine version
          /tmp/wheel-venv/bin/python -c "from distributed_job_engine.main import app; print(app.title)"

      - name: Start the installed package and check /health
        run: |
          cd /tmp
          DATABASE_URL="sqlite:////tmp/jobs.db" WORKER_COUNT=2 \
            /tmp/wheel-venv/bin/job-engine serve --host 127.0.0.1 --port 8123 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8123/api/v1/health; then exit 0; fi
            sleep 1
          done
          echo "installed package did not become healthy"
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

      - name: Attach artifacts to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md"
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
