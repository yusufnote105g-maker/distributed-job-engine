# Alembic configuration for development.
#
# The URL is not stored here: `src/migrations/env.py` reads DATABASE_URL, so no
# credentials end up in the repository.
#
#   DATABASE_URL=postgresql+psycopg2://user:pass@localhost/jobs alembic upgrade head
#   DATABASE_URL=... alembic revision --autogenerate -m "describe the change"
#
# Installed users do not need Alembic at all: `job-engine migrate` runs the
# same scripts from inside the package.

[alembic]
script_location = src/migrations
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
